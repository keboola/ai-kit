<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keboola data app</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script>
      // Fallback error handler — the Vite plugin (vite.config.ts) injects the
      // primary copy via transformIndexHtml.  This inline version only activates
      // when the plugin's copy is absent (e.g. the LLM rewrote vite.config.ts).
      (function () {
        if (window.__kaiNotifyError) return;
        function origin() {
          try {
            var a = window.location.ancestorOrigins;
            if (a && a.length) return a[0];
            if (document.referrer) return new URL(document.referrer).origin;
          } catch (e) {}
          return '*';
        }
        var sent = false;
        function notify(msg, stack) {
          if (sent) return;
          sent = true;
          var payload = { type: 'kai-preview-error', message: msg };
          if (stack) payload.stack = String(stack);
          try {
            window.parent.postMessage(payload, origin());
          } catch (e) {}
        }
        window.__kaiNotifyError = notify;
        window.addEventListener('error', function (ev) {
          notify(
            (ev.error && ev.error.message) || ev.message || 'Unknown error',
            ev.error && ev.error.stack,
          );
        });
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev.reason;
          notify(
            r instanceof Error ? r.message : String(r),
            r instanceof Error ? r.stack : undefined,
          );
        });
        // Healthy beacon: a single postMessage can be lost (parent listener not
        // yet attached, iframe reloaded mid-flight), so re-emit every second
        // until the parent acks with `kai-preview-healthy-ack` (or ~2 min pass).
        var acked = false;
        // Only the embedding parent may ack — a message from any other window
        // must not stop the beacon before the parent actually heard us.
        window.addEventListener('message', function (ev) {
          if (
            ev &&
            ev.source === window.parent &&
            ev.data &&
            ev.data.type === 'kai-preview-healthy-ack'
          )
            acked = true;
        });
        // Never claim healthy after an error: `sent` latches once the error
        // handler fired (even if that one postMessage got lost on the way).
        // __kaiPreviewCrashed is set by the scaffold's ErrorBoundary
        // (`src/main.tsx`, in getDerivedStateFromError) so a render crash that
        // only mounts fallback UI vetoes the beacon. Checked on every beacon
        // tick since a crash can land mid-beacon.
        function sendHealthy() {
          if (sent || window.__kaiPreviewCrashed) return;
          try {
            window.parent.postMessage({ type: 'kai-preview-healthy' }, origin());
          } catch (e) {
            console.warn('[kai-preview] healthy postMessage failed', e);
          }
        }
        function startHealthyBeacon() {
          sendHealthy();
          var attempts = 0;
          var beacon = setInterval(function () {
            if (acked || attempts++ >= 120) {
              clearInterval(beacon);
              return;
            }
            sendHealthy();
          }, 1000);
        }
        var root = document.getElementById('root');
        if (root) {
          if (root.children.length > 0) {
            startHealthyBeacon();
          } else {
            var ob = new MutationObserver(function () {
              if (root.children.length > 0) {
                ob.disconnect();
                startHealthyBeacon();
              }
            });
            ob.observe(root, { childList: true });
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
