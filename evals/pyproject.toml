[project]
name = "ai-kit-evals"
version = "0.1.0"
description = "Tier 0 (static lint) and Tier 1 (activation) evals for ai-kit skills"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["lint", "activation"]
